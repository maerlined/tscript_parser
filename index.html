<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript Parser</title>
<style>
  :root {
    --bg: #0e0e10; --panel: #17171b; --line: #2a2a32;
    --text: #e8e8ea; --muted: #8a8a93; --accent: #7c9eff;
    --ok: #5fd38d; --err: #ff6b6b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    display: flex; justify-content: center; padding: 8vh 24px;
  }
  main { width: 100%; max-width: 560px; }
  h1 { font-size: 1.7rem; margin: 0 0 .35rem; letter-spacing: -.01em; }
  .sub { color: var(--muted); margin: 0 0 1.8rem; }
  code { background: var(--panel); padding: .1em .4em; border-radius: 4px; font-size: .9em; }
  #drop {
    display: flex; flex-direction: column; align-items: center; gap: .35rem;
    padding: 2.4rem 1rem; border: 1.5px dashed var(--line); border-radius: 12px;
    background: var(--panel); cursor: pointer; text-align: center;
    transition: border-color .15s, background .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: #1c1c24; }
  #drop span { font-weight: 600; color: var(--accent); }
  #drop small { color: var(--muted); }
  #results { list-style: none; padding: 0; margin: 1.4rem 0 0; display: grid; gap: .6rem; }
  .row {
    padding: .8rem 1rem; background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px;
  }
  .head { display: flex; align-items: center; gap: .8rem; }
  .info { flex: 1; min-width: 0; }
  .preview {
    margin: .7rem 0 0; padding: .6rem .7rem; max-height: 180px; overflow: auto;
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
    font: .78rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted); white-space: pre;
  }
  .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .status { font-size: .85rem; color: var(--muted); }
  .status.ok { color: var(--ok); }
  .status.err { color: var(--err); }
  button {
    font: inherit; font-weight: 600; padding: .5rem .9rem; border-radius: 8px;
    border: 1px solid var(--accent); background: var(--accent); color: #0e0e10;
    cursor: pointer; white-space: nowrap;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button:not(:disabled):hover { filter: brightness(1.1); }

  /* Rendered quickstart, fetched at runtime from QUICKSTART_BROWSER.md */
  .sep { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0 1.4rem; }
  #quickstart h1 { font-size: 1.35rem; margin: 0 0 .6rem; letter-spacing: -.01em; }
  #quickstart h2 { font-size: 1.05rem; margin: 1.6rem 0 .5rem; }
  #quickstart p, #quickstart li { color: var(--muted); }
  #quickstart p { margin: .55rem 0; }
  #quickstart strong { color: var(--text); font-weight: 600; }
  #quickstart code { background: var(--panel); padding: .1em .4em; border-radius: 4px;
                 font: .88em ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--text); }
  #quickstart pre { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
                padding: .8rem 1rem; overflow-x: auto; margin: .8rem 0;
                font: .82rem/1.55 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #quickstart pre code { background: transparent; padding: 0; border-radius: 0; font-size: inherit; }
  #quickstart ul, #quickstart ol { padding-left: 1.4rem; margin: .5rem 0; }
  #quickstart li { margin: .25rem 0; }
  #quickstart a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Transcript Parser</h1>
  <p class="sub">Upload a <code>.txt</code> transcript. It's parsed into a
  sentence-level CSV you can open in Google Sheets. Everything runs in your
  browser — nothing is uploaded anywhere.</p>

  <label id="drop" for="fileInput">
    <input id="fileInput" type="file" accept=".txt,text/plain" hidden>
    <span>Upload file</span>
    <small>or drag &amp; drop a .txt file here</small>
  </label>

  <ul id="results"></ul>

  <hr class="sep">
  <article id="quickstart"></article>
</main>

<script>
// --- parser (ported from run-with-python/parse_conversation.py) ----------
const TURN_RE = /^[ \t]*(Me|Them):\s*([\s\S]*?)(?=^[ \t]*(?:Me|Them):|$(?![\s\S]))/gm;
const FIRST_SPEAKER_RE = /^[ \t]*(?:Me|Them):/m;
const SENTENCE_RE = /(?<=[.!?])\s+/;

function findTranscript(text) {
  const m = text.match(FIRST_SPEAKER_RE);
  if (!m) throw new Error("No transcript found in file");
  return text.slice(m.index);
}

// Split a turn into sentences. Fragments under 3 words are merged into the
// preceding sentence. Single-sentence turns are returned as-is.
function splitSentences(raw) {
  const cleaned = raw.replace(/\s+/g, " ").trim();
  const parts = cleaned.split(SENTENCE_RE).map(s => s.trim()).filter(Boolean);
  if (parts.length <= 1) return parts;

  const result = [];
  let pending = null;
  for (let s of parts) {
    if (pending !== null) { s = pending + " " + s; pending = null; }
    if (s.split(/\s+/).length < 3) pending = s;
    else result.push(s);
  }
  if (pending !== null) {
    if (result.length) result[result.length - 1] += " " + pending;
    else result.push(pending);
  }
  return result;
}

// Parse transcript text into rows: {passage_id, speaker, sentence_idx, sentence}.
function parseText(text) {
  const transcript = findTranscript(text);
  const rows = [];
  let passageId = 0;
  for (const turn of transcript.matchAll(TURN_RE)) {
    passageId++;
    const speaker = turn[1];
    splitSentences(turn[2]).forEach((sentence, i) => {
      rows.push({ passage_id: passageId, speaker, sentence_idx: i + 1, sentence });
    });
  }
  return rows;
}

// Semicolon-delimited CSV, matching the Python output's columns.
function toCsv(rows) {
  const cols = ["passage_id", "speaker", "sentence_idx", "sentence"];
  const esc = v => {
    const s = String(v);
    return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [cols.join(";")];
  for (const r of rows) lines.push(cols.map(c => esc(r[c])).join(";"));
  return lines.join("\n") + "\n";
}

// --- UI -------------------------------------------------------------------
const drop = document.getElementById("drop");
const input = document.getElementById("fileInput");
const results = document.getElementById("results");

const readText = file => new Promise((resolve, reject) => {
  const fr = new FileReader();
  fr.onload = () => resolve(fr.result);
  fr.onerror = () => reject(fr.error);
  fr.readAsText(file);
});

function download(name, csv) {
  // Append the anchor to the document, trigger a real .click(), and tear it
  // down only on a delay. The detached-anchor + synthetic-dispatchEvent pattern
  // ("modern FileSaver") works in Chromium but fails in Firefox here — the
  // first download per page load works, every one after it comes out 0 KB.
  // This attached-anchor variant was confirmed working on repeated downloads
  // in Firefox via download-test.html (Method B).
  const a = document.createElement("a");
  a.download = name;
  a.rel = "noopener";
  a.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 2000);
  setTimeout(() => URL.revokeObjectURL(a.href), 40000);
}

function showResult(file, status, statusClass, csv, outName) {
  results.innerHTML = "";          // Single file: only ever one result on screen.
  const li = document.createElement("li");
  li.className = "row";

  const head = document.createElement("div");
  head.className = "head";
  head.innerHTML =
    '<div class="info"><div class="name"></div>' +
    '<div class="status ' + statusClass + '"></div></div>';
  head.querySelector(".name").textContent = file.name;
  const statusEl = head.querySelector(".status");
  statusEl.textContent = status;

  const btn = document.createElement("button");
  btn.textContent = "Download .csv";
  btn.disabled = !csv;
  if (csv) btn.onclick = () => {
    download(outName, csv);
    // Confirm the save. Browsers expose no "save dialog finished" event, so
    // this shows as soon as the download is handed off to the browser.
    statusEl.textContent = "Download complete — saved as " + outName;
    statusEl.className = "status ok";
  };
  head.appendChild(btn);
  li.appendChild(head);

  // Show the exact CSV content the Download button will save.
  if (csv) {
    const pre = document.createElement("pre");
    pre.className = "preview";
    pre.textContent = csv;
    li.appendChild(pre);
  }
  results.appendChild(li);
}

async function handleFile(file) {
  const stem = file.name.replace(/\.[^./]+$/, "");
  const outName = stem + "_parsed.csv";
  try {
    const rows = parseText(await readText(file));
    showResult(file, "Parsed " + rows.length + " rows", "ok", toCsv(rows), outName);
  } catch (e) {
    showResult(file, e.message, "err", null, null);
  }
}

input.addEventListener("change", async () => {
  try { if (input.files[0]) await handleFile(input.files[0]); }
  finally { input.value = ""; }   // let the same file be re-selected
});

["dragenter", "dragover"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(ev =>
  drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", e => {
  if (e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
});

// --- Quickstart rendering ------------------------------------------------
// Tiny markdown renderer covering the features used in QUICKSTART_BROWSER.md: headings,
// paragraphs, bold, inline code, fenced code blocks, bullet + numbered lists,
// links.
function renderMarkdown(md) {
  const escHtml = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline = s => escHtml(s)
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>')
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  const lines = md.split("\n");
  const out = [];
  let para = [], list = [], listTag = null;
  const flushPara = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
  const flushList = () => {
    if (list.length) {
      out.push("<" + listTag + ">" + list.map(l => "<li>" + inline(l) + "</li>").join("") + "</" + listTag + ">");
      list = []; listTag = null;
    }
  };
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    if (line.startsWith("```")) {
      flushPara(); flushList();
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith("```")) { buf.push(lines[i]); i++; }
      out.push("<pre><code>" + escHtml(buf.join("\n")) + "</code></pre>");
      continue;
    }
    let m;
    if ((m = line.match(/^(#{1,6})\s+(.*)$/))) {
      flushPara(); flushList();
      const h = m[1].length;
      out.push("<h" + h + ">" + inline(m[2]) + "</h" + h + ">");
      continue;
    }
    let tag = null, item = null;
    if ((m = line.match(/^-\s+(.*)$/)))           { tag = "ul"; item = m[1]; }
    else if ((m = line.match(/^\d+\.\s+(.*)$/)))  { tag = "ol"; item = m[1]; }
    if (tag) {
      flushPara();
      if (listTag && listTag !== tag) flushList();   // switch list type
      listTag = tag;
      list.push(item);
      continue;
    }
    // Indented non-blank line in list context: wrap onto the previous item.
    if (listTag && /^\s+\S/.test(line)) {
      list[list.length - 1] += " " + line.trim();
      continue;
    }
    // Blank line: in a list, defer the flush so the list can resume on the
    // next item; outside a list, it ends the current paragraph.
    if (!line.trim()) {
      if (!listTag) flushPara();
      continue;
    }
    flushList();
    para.push(line.trim());
  }
  flushPara(); flushList();
  return out.join("\n");
}

// Best-effort: fetch the quickstart and render it. Silently no-ops if
// QUICKSTART_BROWSER.md can't be fetched (e.g. opening index.html directly via file://).
fetch("QUICKSTART_BROWSER.md").then(r => r.ok ? r.text() : null).then(md => {
  if (md) document.getElementById("quickstart").innerHTML = renderMarkdown(md);
}).catch(() => {});
</script>
</body>
</html>
